# Used by serve/deploy.sh: builds serve/Dockerfile with the repo root as context.
steps:
  # data/ may not exist yet (fixture deploys); the Dockerfile copies whatever is there.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["-c", "mkdir -p data/raw"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "serve/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
